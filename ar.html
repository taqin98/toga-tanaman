<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Sistem Informasi Tanaman Obat Keluarga (TOGA) berbasis QR Code untuk RT 09 PKK. Temukan informasi lengkap tentang tanaman obat keluarga, manfaat, dan cara penggunaannya dengan mudah melalui pemindaian QR Code." />
    <title>AR TOGA</title>
    <meta name="theme-color" content="#1f7a3e" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TOGA AR" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-startup-image" href="assets/screenshots/install-mobile.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" /></noscript>
    <link rel="stylesheet" href="assets/css/ar.css" />
    <script>
      (function () {
        var splashKey = "toga:splash:shown";
        var installed =
          (typeof window.matchMedia === "function" &&
            window.matchMedia("(display-mode: standalone)").matches) ||
          window.navigator.standalone === true ||
          document.referrer.indexOf("android-app://") === 0;
        var ua = window.navigator.userAgent || "";
        var isiOS = /iphone|ipad|ipod/i.test(ua);
        document.documentElement.classList.add(installed ? "pwa-installed" : "pwa-browser");
        if (isiOS) {
          document.documentElement.classList.add("ios-webkit");
        }
        try {
          var isInternalNav = document.referrer.indexOf(window.location.origin) === 0;
          if (!isInternalNav) {
            sessionStorage.removeItem(splashKey);
          }
          var splashShown = sessionStorage.getItem(splashKey) === "1";
          if (splashShown) {
            document.documentElement.classList.add("pwa-splash-skip");
          } else if (installed) {
            document.documentElement.classList.add("pwa-launch-pending");
          }
        } catch (_) {}
      })();
    </script>
    <script>
      (function () {
        var key = "toga:theme";
        var theme = "";
        try {
          theme = localStorage.getItem(key) || "";
        } catch (_) {}
        if (theme !== "dark" && theme !== "light") {
          theme = "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", theme === "dark" ? "#0f1a14" : "#dff0dd");
        }
      })();
    </script>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  </head>

<body data-ai-chat="off">
    <div id="pwaBootSplash" class="pwa-launch-splash" aria-hidden="true">
      <div class="pwa-launch-splash__inner">
        <img class="pwa-launch-splash__logo" src="assets/icons/icon-192.png" alt="Logo TOGA" />
        <div class="pwa-launch-splash__title">TOGA RT 09</div>
        <div class="pwa-launch-splash__loading">
          <span class="pwa-launch-splash__spinner" aria-hidden="true"></span>
          <span>Memuat aplikasi...</span>
        </div>
      </div>
    </div>
    <div class="ar-camera-stage" id="qrStage">
      <video id="qrVideo" class="ar-camera-video" autoplay muted playsinline></video>
    </div>

    <div class="ar-camera-stage is-hidden" id="arStage"></div>

    <div class="ar-overlay">
      <div class="ar-topbar">
        <a class="ar-icon-btn btn-back" id="btnBack" href="./" aria-label="Kembali ke home">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="m15 6-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
        <div class="ar-topbar__center">
          <div class="hud" id="hud">AR TOGA • Arahkan kamera ke marker pattern</div>
          <div class="ar-stage-indicator" id="stageIndicator" aria-live="polite">
            <div class="ar-stage-indicator__badge" id="stageBadge">Mode QR</div>
          </div>
        </div>
        <button class="ar-icon-btn" id="btnDebugToggle" type="button" aria-label="Buka panel debug">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 8.5A3.5 3.5 0 1 0 12 15.5A3.5 3.5 0 1 0 12 8.5Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M19.4 13.1V10.9l-1.8-.3a5.8 5.8 0 0 0-.5-1.2l1-1.5-1.6-1.6-1.5 1a5.8 5.8 0 0 0-1.2-.5l-.3-1.8h-2.2l-.3 1.8a5.8 5.8 0 0 0-1.2.5l-1.5-1-1.6 1.6 1 1.5a5.8 5.8 0 0 0-.5 1.2l-1.8.3v2.2l1.8.3a5.8 5.8 0 0 0 .5 1.2l-1 1.5 1.6 1.6 1.5-1a5.8 5.8 0 0 0 1.2.5l.3 1.8h2.2l.3-1.8a5.8 5.8 0 0 0 1.2-.5l1.5 1 1.6-1.6-1-1.5a5.8 5.8 0 0 0 .5-1.2l1.8-.3Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="ar-scan-frame" aria-hidden="true">
        <span class="ar-corner tl"></span>
        <span class="ar-corner tr"></span>
        <span class="ar-corner bl"></span>
        <span class="ar-corner br"></span>
        <span class="ar-scan-line"></span>
      </div>

      <div class="ar-dock" id="arDock">
        <a class="btn btn-detail" id="btnDetail" href="#" target="_blank" rel="noopener noreferrer" aria-label="Buka detail tanaman">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4.5 8A2.5 2.5 0 0 1 7 5.5h10A2.5 2.5 0 0 1 19.5 8v8A2.5 2.5 0 0 1 17 18.5H7A2.5 2.5 0 0 1 4.5 16V8Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M9 12h6M12 9v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span class="btn-detail-text">Detail Tanaman</span>
        </a>
      </div>
    </div>

    <div class="debug-panel" id="debugPanel">
      <p class="debug-title">DEBUG MODE • Simulasi marker</p>

      <div class="debug-row">
        <select id="debugSelect" class="debug-select"></select>
      </div>

      <div class="debug-row" style="margin-top: 8px">
        <button id="debugFound" class="debug-btn" type="button">Found</button>
        <button id="debugLost" class="debug-btn" type="button">Lost</button>
        <button id="debugReset" class="debug-btn" type="button">Reset</button>
      </div>

      <div class="debug-row" style="margin-top: 8px">
        <button id="debugExport" class="debug-btn" type="button">
          Export JSON
        </button>
        <button id="debugClear" class="debug-btn" type="button">
          Clear Log
        </button>
      </div>

      <pre
        id="debugLog"
        style="margin-top:8px; max-height:180px; overflow:auto; background:rgba(0,0,0,0.45); padding:8px; border-radius:8px; font-size:12px;"
      >[]</pre>
    </div>

    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/ar.js" defer></script>
    <script src="assets/js/theme.js" defer></script>
    <script src="assets/js/pwa.js" defer></script>
  </body>
</html>
