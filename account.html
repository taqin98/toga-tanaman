<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Masuk ke akun TOGA untuk mengelola jadwal, label warna, dan aksi CRUD kalender."
    />
    <title>Akun TOGA</title>
    <meta name="theme-color" content="#1f7a3e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TOGA" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      />
    </noscript>
    <script>
      (function () {
        var key = "toga:theme";
        var theme = "";
        try {
          theme = localStorage.getItem(key) || "";
        } catch (_) {}
        if (theme !== "dark" && theme !== "light") {
          theme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", theme === "dark" ? "#0f1a14" : "#dff0dd");
        }
      })();
    </script>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/account.css" />
  </head>
  <body>
    <main class="account-shell" data-auth-page>
      <section class="card account-card">
        <div class="account-copy" data-auth-copy>
          <h2 class="account-title" data-auth-title>Masuk</h2>
          <p class="account-desc" data-auth-desc>
            Login untuk mengelola jadwal, label warna, dan perubahan agenda.
          </p>
        </div>

        <div class="auth-status" data-auth-status aria-live="polite" hidden></div>
        <div class="auth-error" data-auth-error hidden></div>

        <div data-auth-guest>
          <form class="auth-form" data-auth-login-form>
            <div class="auth-field">
              <label for="authUsername">Username</label>
              <input id="authUsername" name="username" type="text" autocomplete="username" required />
            </div>
            <div class="auth-field">
              <label for="authPassword">Password</label>
              <div class="auth-password">
                <input
                  id="authPassword"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  required
                />
                <button
                  class="auth-password__toggle"
                  type="button"
                  data-auth-password-toggle
                  aria-label="Tampilkan password"
                  aria-pressed="false"
                >
                  <span class="auth-password__icon auth-password__icon--show" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                      <path
                        d="M2.25 12S5.25 6.75 12 6.75 21.75 12 21.75 12 18.75 17.25 12 17.25 2.25 12 2.25 12Z"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                      <circle cx="12" cy="12" r="2.75" stroke="currentColor" stroke-width="1.7" />
                    </svg>
                  </span>
                  <span class="auth-password__icon auth-password__icon--hide" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                      <path
                        d="M3 3 21 21"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                      <path
                        d="M10.58 10.58A2 2 0 0 0 12 14a2 2 0 0 0 1.42-.58"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                      <path
                        d="M9.88 5.09A10.94 10.94 0 0 1 12 4.88c6.75 0 9.75 7.12 9.75 7.12a16.57 16.57 0 0 1-3.04 4.17"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                      <path
                        d="M6.61 6.62A16.28 16.28 0 0 0 2.25 12s3 7.12 9.75 7.12a10.77 10.77 0 0 0 4.22-.82"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </span>
                </button>
              </div>
            </div>
            <button class="auth-submit" type="submit" data-auth-submit>
              <span class="auth-submit__spinner" aria-hidden="true"></span>
              <span class="auth-submit__label" data-auth-submit-label>Login</span>
            </button>
          </form>

          <div class="auth-divider">atau</div>

          <div class="auth-google" data-auth-google-wrap>
            <div class="auth-google__button" data-auth-google-button></div>
            <p class="auth-google__hint" data-auth-google-hint></p>
          </div>
        </div>

        <div class="account-user" data-auth-user hidden>
          <div class="account-user__head">
            <div class="account-avatar" data-auth-avatar>?</div>
            <div>
              <h4 class="account-user__name" data-auth-name>-</h4>
              <p class="account-user__meta" data-auth-meta>-</p>
            </div>
          </div>

          <div class="account-user__actions">
            <a class="account-link" href="jadwal.html">Jadwal</a>
            <button class="auth-secondary" type="button" data-auth-logout>Logout</button>
          </div>
        </div>
      </section>
    </main>

    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/theme.js" defer></script>
    <script src="assets/js/auth.js" defer></script>
    <script src="assets/js/pwa.js" defer></script>
  </body>
</html>
