<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Sistem Informasi Tanaman Obat Keluarga (TOGA) berbasis QR Code untuk RT 09 PKK. Temukan informasi lengkap tentang tanaman obat keluarga, manfaat, dan cara penggunaannya dengan mudah melalui pemindaian QR Code." />
    <title>Scan QR TOGA</title>
    <meta name="theme-color" content="#1f7a3e" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TOGA Scan" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-startup-image" href="assets/screenshots/install-mobile.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" /></noscript>
    <link rel="stylesheet" href="assets/css/ar.css" />
    <script>
      (function () {
        var splashKey = "toga:splash:shown";
        var installed =
          (typeof window.matchMedia === "function" &&
            window.matchMedia("(display-mode: standalone)").matches) ||
          window.navigator.standalone === true ||
          document.referrer.indexOf("android-app://") === 0;
        var ua = window.navigator.userAgent || "";
        var isiOS = /iphone|ipad|ipod/i.test(ua);
        document.documentElement.classList.add(installed ? "pwa-installed" : "pwa-browser");
        if (isiOS) {
          document.documentElement.classList.add("ios-webkit");
        }
        try {
          var isInternalNav = document.referrer.indexOf(window.location.origin) === 0;
          if (!isInternalNav) {
            sessionStorage.removeItem(splashKey);
          }
          var splashShown = sessionStorage.getItem(splashKey) === "1";
          if (splashShown) {
            document.documentElement.classList.add("pwa-splash-skip");
          } else if (installed) {
            document.documentElement.classList.add("pwa-launch-pending");
          }
        } catch (_) {}
      })();
    </script>
    <script>
      (function () {
        var key = "toga:theme";
        var theme = "";
        try {
          theme = localStorage.getItem(key) || "";
        } catch (_) {}
        if (theme !== "dark" && theme !== "light") {
          theme = "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", theme === "dark" ? "#0f1a14" : "#dff0dd");
        }
      })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  </head>

<body data-ai-chat="off">
    <div id="pwaBootSplash" class="pwa-launch-splash" aria-hidden="true">
      <div class="pwa-launch-splash__inner">
        <img class="pwa-launch-splash__logo" src="assets/icons/icon-192.png" alt="Logo TOGA" />
        <div class="pwa-launch-splash__title">TOGA RT 09</div>
        <div class="pwa-launch-splash__loading">
          <span class="pwa-launch-splash__spinner" aria-hidden="true"></span>
          <span>Memuat aplikasi...</span>
        </div>
      </div>
    </div>
    <div class="ar-overlay">
      <div class="ar-topbar">
        <a class="ar-icon-btn btn-back" id="btnBack" href="./" aria-label="Kembali ke home">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="m15 6-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
        <div class="hud" id="hud">Scan kartu</div>
      </div>

      <div class="ar-scan-frame" aria-hidden="true">
        <span class="ar-corner tl"></span>
        <span class="ar-corner tr"></span>
        <span class="ar-corner bl"></span>
        <span class="ar-corner br"></span>
        <span class="ar-scan-line"></span>
      </div>

      <div class="ar-instruction" id="arInstruction" role="status" aria-live="polite">
        <span class="ar-instruction__spinner" id="arInstructionSpinner" aria-hidden="true"></span>
        <span class="ar-instruction__icon" id="arInstructionIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="m5 12 4.2 4.2L19 6.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span class="ar-instruction__copy">
          <span class="ar-instruction__title" id="arInstructionTitle">Membuka AR...</span>
          <span class="ar-instruction__desc" id="arInstructionDesc">Arahkan kamera ke kode pada kartu.</span>
        </span>
      </div>
      <div class="ar-toast" id="arToast" role="status" aria-live="polite"></div>
    </div>

    <canvas id="qrCanvas" class="qr-canvas" aria-hidden="true" style="display: none;"></canvas>
    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/scan-qr.js" defer></script>
    <script src="assets/js/theme.js" defer></script>
    <script src="assets/js/pwa.js" defer></script>
  </body>
</html>
