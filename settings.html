<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Pengaturan aplikasi TOGA RT 09 untuk tema tampilan dan preferensi dasar."
    />
    <title>Settings TOGA</title>
    <meta name="theme-color" content="#1f7a3e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TOGA" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      />
    </noscript>
    <script>
      (function () {
        var key = "toga:theme";
        var theme = "";
        try {
          theme = localStorage.getItem(key) || "";
        } catch (_) {}
        if (theme !== "dark" && theme !== "light") {
          theme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", theme === "dark" ? "#0f1a14" : "#dff0dd");
        }
      })();
    </script>
    <style>
      :root {
        --bg: #eef7ef;
        --bg2: #d9ecd8;
        --text: #173626;
        --muted: #607b69;
        --line-soft: rgba(23, 72, 44, 0.08);
        --line: rgba(23, 72, 44, 0.16);
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #09110d;
        --bg2: #0f1a14;
        --text: #e6f3ea;
        --muted: #9eb7a8;
        --line-soft: rgba(166, 209, 181, 0.13);
        --line: rgba(166, 209, 181, 0.24);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(720px 360px at 15% -4%, rgba(66, 164, 85, 0.2), transparent 68%),
          radial-gradient(680px 420px at 100% 10%, rgba(158, 205, 103, 0.28), transparent 66%),
          linear-gradient(170deg, var(--bg), var(--bg2));
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        border-bottom: 1px solid rgba(255, 255, 255, 0.75);
        background: rgba(235, 247, 233, 0.86);
        backdrop-filter: blur(18px);
      }
      html[data-theme="dark"] .topbar {
        border-bottom-color: rgba(166, 209, 181, 0.16);
        background: rgba(12, 22, 16, 0.78);
      }
      .top-wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .top-wrap__main {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .top-wrap__actions {
        flex: 0 0 auto;
      }
      .back-btn {
        width: 36px;
        height: 36px;
        border-radius: 11px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.72);
        color: var(--text);
        display: grid;
        place-items: center;
        text-decoration: none;
      }
      html[data-theme="dark"] .back-btn {
        border-color: rgba(166, 209, 181, 0.3);
        background: rgba(20, 34, 26, 0.92);
        color: #d9efdf;
      }
      .title {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
      }
      .subtitle {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .profile-menu {
        position: relative;
      }
      .profile-menu[open] {
        z-index: 25;
      }
      .profile-menu summary {
        list-style: none;
      }
      .profile-menu summary::-webkit-details-marker {
        display: none;
      }
      .profile-menu__trigger {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        border: 1px solid rgba(101, 145, 108, 0.24);
        background: rgba(255, 255, 255, 0.74);
        color: var(--text);
        display: grid;
        place-items: center;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(74, 115, 79, 0.12);
      }
      .profile-menu__icon {
        width: 20px;
        height: 20px;
        display: block;
      }
      .profile-menu__dropdown {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        min-width: 156px;
        display: grid;
        gap: 4px;
        padding: 8px;
        border-radius: 18px;
        border: 1px solid var(--line-soft);
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.96), rgba(244, 253, 242, 0.92));
        box-shadow: 0 18px 34px rgba(47, 93, 59, 0.16);
      }
      .profile-menu__item {
        display: flex;
        align-items: center;
        min-height: 40px;
        padding: 0 12px;
        border-radius: 12px;
        text-decoration: none;
        color: #244c35;
        font-size: 13px;
        font-weight: 700;
      }
      .profile-menu__item:hover,
      .profile-menu__item:focus-visible,
      .profile-menu__item.is-active {
        background: rgba(86, 160, 97, 0.12);
        color: #1f7a3e;
        outline: none;
      }
      html[data-theme="dark"] .profile-menu__trigger {
        border-color: rgba(157, 203, 173, 0.24);
        background: rgba(21, 33, 26, 0.88);
        color: #d6eadc;
      }
      html[data-theme="dark"] .profile-menu__dropdown {
        border-color: rgba(166, 209, 181, 0.18);
        background: linear-gradient(165deg, rgba(24, 39, 30, 0.98), rgba(16, 27, 21, 0.96));
        box-shadow: 0 18px 34px rgba(0, 0, 0, 0.34);
      }
      html[data-theme="dark"] .profile-menu__item {
        color: #d6eadc;
      }
      html[data-theme="dark"] .profile-menu__item:hover,
      html[data-theme="dark"] .profile-menu__item:focus-visible,
      html[data-theme="dark"] .profile-menu__item.is-active {
        background: rgba(122, 183, 77, 0.18);
        color: #f3ffef;
      }
      .container {
        max-width: 920px;
        margin: 0 auto;
        padding: 16px 14px calc(110px + env(safe-area-inset-bottom));
      }
      .card {
        border-radius: 20px;
        border: 1px solid var(--line-soft);
        background: linear-gradient(168deg, rgba(255, 255, 255, 0.94), rgba(245, 255, 244, 0.84));
        box-shadow: 0 20px 36px rgba(64, 107, 72, 0.18);
        padding: 14px;
        margin-bottom: 12px;
      }
      html[data-theme="dark"] .card {
        background: linear-gradient(168deg, rgba(24, 39, 30, 0.96), rgba(17, 30, 23, 0.94));
        box-shadow: 0 20px 36px rgba(0, 0, 0, 0.35);
      }
      .section-title {
        margin: 0 0 6px;
        font-size: 16px;
        font-weight: 800;
      }
      .section-desc {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }
      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }
      .setting-title {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 800;
      }
      .setting-desc {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .theme-switch {
        position: relative;
        display: inline-flex;
      }
      .theme-switch input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .theme-switch-track {
        width: 58px;
        height: 32px;
        border-radius: 999px;
        background: rgba(50, 124, 73, 0.18);
        border: 1px solid rgba(50, 124, 73, 0.2);
        position: relative;
        transition: background 0.2s ease, border-color 0.2s ease;
      }
      .theme-switch-track::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.16);
        transition: transform 0.22s ease;
      }
      .theme-switch input:checked + .theme-switch-track {
        background: rgba(122, 183, 77, 0.4);
        border-color: rgba(122, 183, 77, 0.48);
      }
      .theme-switch input:checked + .theme-switch-track::after {
        transform: translateX(26px);
      }
      .meta {
        margin: 0;
        padding-left: 18px;
        line-height: 1.7;
      }
      .bottom-nav {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(10px + env(safe-area-inset-bottom));
        z-index: 30;
        border-radius: 24px;
        padding: 10px 12px;
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.9), rgba(241, 250, 239, 0.8));
        border: 1px solid rgba(101, 145, 108, 0.18);
        backdrop-filter: blur(20px);
        box-shadow: 0 14px 30px rgba(64, 107, 72, 0.16);
      }
      html[data-theme="dark"] .bottom-nav {
        background: linear-gradient(160deg, rgba(18, 31, 24, 0.9), rgba(13, 22, 17, 0.86));
        border-color: rgba(157, 203, 173, 0.2);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
      }
      .bottom-nav-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .bottom-nav-item {
        display: flex;
        justify-content: center;
      }
      .bottom-nav-link {
        display: inline-flex;
        width: 100%;
        min-width: 0;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        text-decoration: none;
        color: #5c7762;
        font-size: 10px;
        font-weight: 700;
      }
      html[data-theme="dark"] .bottom-nav-link {
        color: #9db6a7;
      }
      .bottom-nav-label {
        white-space: nowrap;
        line-height: 1.1;
      }
      .bottom-nav-icon {
        width: 24px;
        height: 24px;
        display: block;
      }
      .bottom-nav-icon-wrap {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(103, 145, 109, 0.24);
        background: rgba(229, 244, 226, 0.8);
      }
      html[data-theme="dark"] .bottom-nav-icon-wrap {
        border-color: rgba(157, 203, 173, 0.24);
        background: rgba(25, 43, 32, 0.85);
      }
      .bottom-nav-link.is-active {
        color: #2f7c4d;
      }
      .bottom-nav-link.is-active .bottom-nav-icon-wrap {
        border-color: rgba(61, 148, 84, 0.46);
        background: linear-gradient(140deg, rgba(77, 170, 95, 0.27), rgba(157, 211, 109, 0.25));
        transform: translateY(-1px) scale(1.03);
        box-shadow: 0 10px 16px rgba(85, 148, 84, 0.22);
      }
    </style>
  </head>
